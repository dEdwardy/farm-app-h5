name: release-automation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Write build fingerprint
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/build-info.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-app-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  deploy-aliyun:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'revert(auto):')
    needs: build-check
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
    steps:
      - name: Validate deploy secrets
        run: |
          for key in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY SERVER_DEPLOY_PATH; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done

      - name: Download tested build artifact
        uses: actions/download-artifact@v5
        with:
          name: farm-app-dist-${{ github.sha }}
          path: dist

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload dist to Aliyun server
        run: |
          echo "Deploying commit $GITHUB_SHA to $SERVER_USER@$SERVER_HOST:$SERVER_DEPLOY_PATH"
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SERVER_DEPLOY_PATH'"
          tar -czf dist.tar.gz -C dist .
          ls -lh dist.tar.gz
          scp -P "$SERVER_PORT" dist.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/farm-app.tar.gz"
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "find '$SERVER_DEPLOY_PATH' -mindepth 1 -maxdepth 1 -exec rm -rf {} + && tar -xzf /tmp/farm-app.tar.gz -C '$SERVER_DEPLOY_PATH' && rm -f /tmp/farm-app.tar.gz"

      - name: Verify deployed build fingerprint
        run: |
          DEPLOYED_SHA=$(ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "cat '$SERVER_DEPLOY_PATH/build-info.txt'")
          echo "Remote build fingerprint: $DEPLOYED_SHA"

          if [ "$DEPLOYED_SHA" != "$GITHUB_SHA" ]; then
            echo "Remote fingerprint mismatch. Expected $GITHUB_SHA, got $DEPLOYED_SHA"
            exit 1
          fi

      - name: Reload nginx
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "sudo nginx -t && sudo systemctl reload nginx"
