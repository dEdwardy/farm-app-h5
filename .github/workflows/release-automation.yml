name: release-automation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: release-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  post-deploy-smoke:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'revert(auto):')
    needs: build-check
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Validate production URL variable
        run: |
          if [ -z "${PRODUCTION_URL}" ]; then
            echo "Repository variable PRODUCTION_URL is required."
            exit 1
          fi

      - name: Wait deployment warmup
        run: sleep 60

      - name: Smoke check homepage and login
        run: |
          set -euo pipefail

          check_url() {
            local url="$1"
            for attempt in 1 2 3 4 5; do
              code=$(curl -L -sS -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$code" = "200" ]; then
                echo "PASS: $url -> $code"
                return 0
              fi
              echo "WAIT: $url -> $code (attempt $attempt/5)"
              sleep 12
            done
            echo "FAIL: $url did not return 200"
            return 1
          }

          check_url "${PRODUCTION_URL}"
          check_url "${PRODUCTION_URL%/}/login"

  auto-rollback:
    if: failure() && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'revert(auto):')
    needs:
      - build-check
      - post-deploy-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Revert failed release commit
        run: |
          set -euo pipefail
          git revert --no-edit "${GITHUB_SHA}"
          git commit --amend -m "revert(auto): rollback failed release ${GITHUB_SHA}"
          git push origin HEAD:master
