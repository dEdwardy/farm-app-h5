name: release-automation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Write build fingerprint
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/build-info.txt

  deploy-aliyun:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'revert(auto):')
    needs: build-check
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate deploy secrets
        run: |
          for key in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY SERVER_DEPLOY_PATH; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload dist to Aliyun server
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$SERVER_DEPLOY_PATH'"
          tar -czf dist.tar.gz -C dist .
          ls -lh dist.tar.gz
          scp -P "$SERVER_PORT" dist.tar.gz "$SERVER_USER@$SERVER_HOST:/tmp/farm-app.tar.gz"
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "find '$SERVER_DEPLOY_PATH' -mindepth 1 -maxdepth 1 -exec rm -rf {} + && tar -xzf /tmp/farm-app.tar.gz -C '$SERVER_DEPLOY_PATH' && rm -f /tmp/farm-app.tar.gz"

      - name: Verify deployed build fingerprint
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "cat '$SERVER_DEPLOY_PATH/build-info.txt'"

      - name: Reload nginx
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "sudo nginx -t && sudo systemctl reload nginx"

  post-deploy-smoke:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'revert(auto):')
    needs: deploy-aliyun
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Validate production URL variable
        run: |
          if [ -z "${PRODUCTION_URL}" ]; then
            echo "Repository variable PRODUCTION_URL is required."
            exit 1
          fi

      - name: Wait deployment warmup
        run: sleep 60

      - name: Smoke check homepage and login
        run: |
          set -euo pipefail

          build_info_url="${PRODUCTION_URL%/}/build-info.txt"
          remote_sha=$(curl -L -sS "$build_info_url" | tr -d '\r\n')
          if [ "$remote_sha" != "$BUILD_SHA" ]; then
            echo "FAIL: build-info mismatch: expected $BUILD_SHA got $remote_sha"
            exit 1
          fi

          check_url() {
            local url="$1"
            for attempt in 1 2 3 4 5; do
              code=$(curl -L -sS -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$code" = "200" ]; then
                echo "PASS: $url -> $code"
                return 0
              fi
              echo "WAIT: $url -> $code (attempt $attempt/5)"
              sleep 12
            done
            echo "FAIL: $url did not return 200"
            return 1
          }

          check_url "${PRODUCTION_URL}"
          check_url "${PRODUCTION_URL%/}/login"

  auto-rollback:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'revert(auto):') && (needs.deploy-aliyun.result == 'failure' || needs.post-deploy-smoke.result == 'failure')
    needs:
      - build-check
      - deploy-aliyun
      - post-deploy-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Revert failed release commit
        run: |
          set -euo pipefail
          git revert --no-edit "${GITHUB_SHA}"
          git commit --amend -m "revert(auto): rollback failed release ${GITHUB_SHA}"
          git push origin HEAD:master
