# 养殖场管理 PWA - Nginx 子目录配置
# 将此配置添加到你现有的 server {} 块中（已有 SSL 证书）

# 处理 /farm-app (无尾部斜杠) - 重定向
location = /farm-app {
    return 301 /farm-app/;
}

# PWA 子目录配置
location ^~ /farm-app/ {
    alias /usr/pros/farm-app/;  # 注意：alias 路径必须以 / 结尾
    index index.html;
    
    # SPA 路由支持
    try_files $uri $uri/ /farm-app/index.html;

    # Service Worker 不缓存
    location ~* sw\.js$ {
        alias /usr/pros/farm-app/sw.js;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # manifest 文件不缓存
    location ~* manifest\.webmanifest$ {
        alias /usr/pros/farm-app/manifest.webmanifest;
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/manifest+json";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Gzip 压缩（如果尚未启用）
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;
